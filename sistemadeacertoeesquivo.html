<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sistemadeacertoeesquivo.css">

    <title>Arena de Batalha</title>
</head>

<body>

    <div class="arena">

        <div class="titulo">
            ⚔️ Arena de Batalha
        </div>


        <!-- MOEDAS -->

        <div class="moedas">
            🪙 <span id="moedas">0</span>
        </div>


        <!-- BARRAS DE VIDA -->

        <div class="status">

            <div class="status-box">

                Herói

                <div class="barra">
                    <div id="hpHeroi" class="hp">
                    </div>
                </div>

                <span id="textoHeroi">
                    100 HP
                </span>

            </div>


            <div class="status-box">

                Monstro

                <div class="barra">
                    <div id="hpMonstro" class="hp">
                    </div>
                </div>

                <span id="textoMonstro">
                    100 HP
                </span>

            </div>

        </div>

        <div class="personagem heroi">

            <img src="./Imagens/Personagens/klatos.png">

        </div>

        <div class="personagem monstro">

            <img src="./Imagens/Elementos_gráficos/monstro.png.png">

        </div>

        <div class="botoes">

            <button id="btnAtacar" onclick="atacar()">
                ⚔️ Atacar
            </button>

            <button id="btnEsquivar" onclick="esquivar()">
                💨 Esquivar
            </button>

            <button id="btnPocao" onclick="pocao()">
                🧪 Usar Poção
            </button>

            <button id="btnReiniciar" onclick="reiniciarBatalha()">
                🔄 Reiniciar
            </button>

        </div>

    </div>


    <script>

        let hpHeroi = 100;
        let hpMonstro = 100;

        let moedas = 0;


        function atualizarTela() {

            document.getElementById("hpHeroi").style.width =
                hpHeroi + "%";

            document.getElementById("hpMonstro").style.width =
                hpMonstro + "%";

            document.getElementById("textoHeroi").textContent =
                hpHeroi + " HP";

            document.getElementById("textoMonstro").textContent =
                hpMonstro + " HP";

            document.getElementById("moedas").textContent =
                moedas;

        }


        function atacar() {

            if (hpHeroi <= 0 || hpMonstro <= 0) {
                return;
            }

            /* dano do herói */

            let dano =
                Math.floor(Math.random() * 20) + 10;

            hpMonstro -= dano;

            if (hpMonstro < 0) {
                hpMonstro = 0;
            }

            atualizarTela();


            /* monstro derrotado */

            if (hpMonstro === 0) {

                moedas += 10;

                alert(
                    "🏆 Você venceu!\n" +
                    "🪙 +10 moedas!"
                );

                atualizarTela();

                return;
            }


            /* contra-ataque */

            setTimeout(() => {

                let danoMonstro =
                    Math.floor(Math.random() * 15) + 5;

                hpHeroi -= danoMonstro;

                if (hpHeroi < 0) {
                    hpHeroi = 0;
                }

                atualizarTela();


                if (hpHeroi === 0) {

                    alert("💀 Você foi derrotado!");

                }

            }, 500);

        }

        function pocao() {

            if (hpHeroi <= 0) {
                return;
            }

            hpHeroi += 20;

            if (hpHeroi > 100) {
                hpHeroi = 100;
            }

            atualizarTela();

        }
        atualizarTela();

    </script>

</body>

</html>
