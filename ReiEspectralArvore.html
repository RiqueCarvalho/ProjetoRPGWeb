<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Árvore de Habilidades - Rei Espectral</title>

    <link rel="stylesheet" href="ReiEspectralArvore.css">
</head>

<body>

    <div class="container">

        <header class="header">

            <button class="back" onclick="voltar()">
                ← Voltar
            </button>

            <div class="heading">
                <h1>Árvore de Habilidades</h1>
                <div class="subtitle">O LEGADO DO REI ESPECTRAL</div>
            </div>

            <div class="xp-box">
                <strong id="xp">0 XP</strong>

                <div class="progress">
                    <div class="progress-bar" id="progress"></div>
                </div>
            </div>

        </header>

        <section class="tree-container">

            <div class="runes"></div>

            <div class="dark-aura"></div>

            <svg class="connections"
                 viewBox="0 0 1000 620"
                 preserveAspectRatio="none">

                <line x1="500" y1="310" x2="250" y2="150"/>
                <line x1="500" y1="310" x2="750" y2="150"/>
                <line x1="500" y1="310" x2="500" y2="520"/>

            </svg>

            <!-- NÚCLEO CENTRAL -->

            <button class="node core" data-id="core">

                <span class="symbol">☠</span>
                <span class="rank">REI</span>

            </button>

            <!-- PODER ESPECTRAL -->

            <button class="node available" data-id="power">

                <span class="symbol">ϟ</span>
                <span class="rank">0/3</span>

            </button>

            <!-- ARMADURA DAS TREVAS -->

            <button class="node available" data-id="armor">

                <span class="symbol">♜</span>
                <span class="rank">0/3</span>

            </button>

            <!-- ESSÊNCIA AMALDIÇOADA -->

            <button class="node available" data-id="essence">

                <span class="symbol">✧</span>
                <span class="rank">0/3</span>

            </button>

        </section>

        <!-- PAINEL DE DETALHES -->

        
        <section class="details">

            <h2 id="skill-name">Coração Espectral</h2>
        
            <p id="skill-desc">
                Selecione uma habilidade para conhecer seus poderes.
            </p>
        
            <div class="bonus" id="skill-bonus"></div>
        
            <div class="skill-cost" id="skill-cost"></div>
        
            <button class="upgrade" id="upgrade" disabled>
                Habilidade central
            </button>
        
        </section>

        <p class="note">
            Cada melhoria custa 1.000 XP.
            Ganhe experiência avançando no jogo.
        </p>

    </div>

    <script src="ReiEspectralArvore.html"></script>

</body>

</html>
