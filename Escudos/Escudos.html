<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preload" href="../Imagens/Cenários/Fundp.png" as="image" />
  <title>Escudos</title>
  <link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Cinzel:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="Escudos.css" />
  <link rel="stylesheet" href="../transicao.css" />
  <style></style>
</head>

<body>
  <div class="tela">
    <div class="voltar" id="voltar" title="Voltar">&#8592;</div>
    <h1 class="titulo">Escudos</h1>

    <div class="saldo" title="Seu saldo">
      <img id="saldoIcone" alt="Moedas" />
      <span id="saldoValor">0</span>
    </div>

    <div class="palco">
      <button class="seta esq" id="anterior" aria-label="Anterior"></button>
      <div class="lista" id="lista"></div>
      <button class="seta dir" id="proximo" aria-label="Próximo"></button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="caixa">
      <p id="modalTexto"></p>
      <div class="acoes">
        <button id="modalComprar" class="btn-comprar">Comprar</button>
        <button id="modalFechar" class="btn-cancelar">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="../saldo.js"></script>
  <script src="../transicao.js"></script>
  <script>
    /* =====================================================
 CONFIGURAÇÃO — edite aqui para trocar as imagens
 =====================================================
 imagem : arte da armadura (PNG com fundo transparente)
 painel : imagem pronta da parte de baixo do card (nome, nível,
          classe, descrição e preço). Se deixar vazio ("") o
          painel é montado com texto usando os campos abaixo.
 cor    : cor da borda do card (e do título, se usar texto)
 Os campos icone, nivel, classe, preco e desc só são usados
 quando "painel" estiver vazio.
*/
    const ICONE_NIVEL = "imagens/icone-nivel.png"; // ícone ao lado de "Nível / Classe"
    let SALDO = window.SaldoLoja.ler(); // saldo compartilhado entre todas as telas
    const POR_PAGINA = 6; // quantos cards aparecem por vez

    const armaduras = [
      {
        nome: "Escudo do Sport",
        imagem: "../Imagens/Elementos_gráficos/Escudo do Sport.png",
        painel: "../Imagens/Elementos_gráficos/Escudo do Sport Descrição.png",
        cor: "#f08a1c",
        preco: 3500,
      },
      {
        nome: "Escudo de gelo",
        imagem: "../Imagens/Elementos_gráficos/Escudo de gelo.png",
        painel: "../Imagens/Elementos_gráficos/Escudo de gelo Descrição.png",
        icone: "imagens/icone-gelo.png",
        cor: "#002299",
        preco: 2500,
      },
      {
        nome: "Escudo do selva",
        imagem: "../Imagens/Elementos_gráficos/Escudo da selva.png",
        painel: "../Imagens/Elementos_gráficos/Escudo da selva Descrição.png",
        icone: "imagens/icone-caos.png",
        cor: "#086600",
        preco: 4500,
      },
      {
        nome: "Escudo com espinhos",
        imagem: "../Imagens/Elementos_gráficos/Escudo com espinhos.png",
        painel: "../Imagens/Elementos_gráficos/Escudo com espinhos Descrição.png",
        icone: "imagens/icone-paladino.png",
        cor: "#3D0000",
        preco: 1200,
      },
      {
        nome: "Escudo com detalhes em vermelho",
        imagem: "../Imagens/Elementos_gráficos/Escudo com bagulho vermelho.png",
        painel: "../Imagens/Elementos_gráficos/Escudo com bagulho vermelho Descrição.png",
        icone: "imagens/icone-fogo.png",
        cor: "#7A0000",
        preco: 1500,
      },
      {
        nome: "Escudo azul com detalhes em amarelo",
        imagem: "../Imagens/Elementos_gráficos/Escudo Azul com bagulho amarelo.png",
        painel: "../Imagens/Elementos_gráficos/Escudo Azul com bagulho amarelo Descrição.png",
        icone: "imagens/icone-mago.png",
        cor: "#002B96",
        preco: 2000,
      },
      // Adicione mais armaduras aqui — as setas aparecem automaticamente.
    ];

    /* ===================== LÓGICA ===================== */
    const lista = document.getElementById("lista");
    const btnAnt = document.getElementById("anterior");
    const btnProx = document.getElementById("proximo");
    let inicio = 0;

    const fmt = (n) => n.toLocaleString("pt-BR");

    function criarCard(a) {
      const el = document.createElement("article");
      el.className = "card";
      el.style.setProperty("--cor", a.cor);
      const arte = a.imagem
        ? `<div class="arte"><img src="${a.imagem}" alt="${a.nome}"></div>`
        : a.painel
          ? ""
          : '<div class="arte"><span class="arte-indisponivel">Imagem não encontrada</span></div>';
      if (a.painel) {
        el.innerHTML =
          arte +
          `<img class="painel" src="${a.painel}" alt="${a.nome} - detalhes">`;
        const imgArte = el.querySelector(".arte img");
        if (imgArte) {
          imgArte.onerror = () => {
            imgArte.replaceWith(
              Object.assign(document.createElement("span"), {
                className: "arte-indisponivel",
                textContent: "Imagem não encontrada",
              }),
            );
          };
        }
        el.addEventListener("click", () => comprar(a));
        return el;
      }
      el.innerHTML =
        arte +
        `
    <div class="nome">${a.icone ? `<img src="${a.icone}" alt="" onerror="this.style.visibility='hidden'">` : ""}${a.nome}</div>
    <div class="info">
      ${a.nivel && a.classe ? `<div class="meta"><img src="${ICONE_NIVEL}" alt="" onerror="this.style.visibility='hidden'"><div>Nível: ${a.nivel}<br>Classe: ${a.classe}</div></div>` : ""}
      ${a.desc ? `<p class="desc">${a.desc}</p>` : ""}
      <div class="preco"><span class="moeda"></span>Preço: ${fmt(a.preco)}</div>
    </div>`;
      el.addEventListener("click", () => comprar(a));
      return el;
    }

    function render() {
      lista.innerHTML = "";
      armaduras
        .slice(inicio, inicio + POR_PAGINA)
        .forEach((a) => lista.appendChild(criarCard(a)));
      btnAnt.disabled = inicio === 0;
      btnProx.disabled = inicio + POR_PAGINA >= armaduras.length;
    }

    btnAnt.onclick = () => {
      inicio = Math.max(0, inicio - 1);
      render();
    };
    btnProx.onclick = () => {
      inicio = Math.min(armaduras.length - POR_PAGINA, inicio + 1);
      render();
    };

    /* Ações — conecte ao seu jogo aqui */
    let armaduraSelecionada = null;

    /* Saldo: atualiza o número na tela. Chame atualizarSaldo() sempre que SALDO mudar. */
    function atualizarSaldo() {
      SALDO = window.SaldoLoja.ler();
      document.getElementById("saldoValor").textContent = fmt(SALDO);
    }
    function iniciarIconeMoeda() {
      const img = document.getElementById("saldoIcone");
      const moeda = document.createElement("span");
      moeda.className = "moeda";
      img.replaceWith(moeda);
    }

    function comprar(a) {
      armaduraSelecionada = a;
      document.getElementById("modalTexto").textContent =
        `Comprar ${a.nome} por ${fmt(a.preco)} moedas?`;
      document.getElementById("modalComprar").style.display = "";
      document.getElementById("modal").classList.add("aberto");
    }

    function fecharModal() {
      document.getElementById("modal").classList.remove("aberto");
      armaduraSelecionada = null;
    }

    /* Chamada quando o jogador clica em "Comprar". Retorne true se a compra deu certo.
 Coloque aqui o resto da sua lógica (ex.: guardar a armadura no inventário). */
    function confirmarCompra(a) {
      const saldoAtual = window.SaldoLoja.ler();
      if (saldoAtual < a.preco) return false;
      SALDO = window.SaldoLoja.salvar(saldoAtual - a.preco);
      atualizarSaldo();
      // exemplo: inventario.push(a.nome);
      return true;
    }

    document.getElementById("modalComprar").onclick = () => {
      if (!armaduraSelecionada) return;
      if (confirmarCompra(armaduraSelecionada)) {
        fecharModal();
      } else {
        document.getElementById("modalTexto").textContent =
          "Saldo insuficiente de moedas!";
        document.getElementById("modalComprar").style.display = "none";
      }
    };
    document.getElementById("modalFechar").onclick = fecharModal;
    document.getElementById("voltar").onclick = () =>
      window.transicaoVoltar();

    atualizarSaldo();
    iniciarIconeMoeda();
    render();
    window.addEventListener("saldoAtualizado", (evento) => {
      SALDO = evento.detail;
      document.getElementById("saldoValor").textContent = fmt(SALDO);
    });
  </script>
</body>

</html>
