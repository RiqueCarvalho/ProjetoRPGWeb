<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preload" href="../Imagens/Cen%C3%A1rios/Fundp.png" as="image" />
  <title>Espadas</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Espadas.css" />
  <link rel="stylesheet" href="../EstiloLojaCategorias.css" />
  <link rel="stylesheet" href="../transicao.css" />
  <style></style>
</head>

<body class="tela-categoria tela-categoria--grade tela-categoria--grade-6">
  <div class="tela">
    <button class="moldura voltar" id="voltar" type="button" aria-label="Voltar">
      <span class="seta-voltar" aria-hidden="true">←</span>
      <span>Voltar</span>
    </button>
    <h1 class="titulo">Espadas</h1>

    <div class="moldura saldo" title="Seu saldo">
      <img id="saldoIcone" alt="Moedas" />
      <span class="saldo-texto">
        <strong id="saldoValor"></strong>
        <span>Moedas</span>
      </span>
    </div>

    <div class="palco">
      <button class="seta esq" id="anterior" aria-label="Anterior"></button>
      <div class="lista" id="lista"></div>
      <button class="seta dir" id="proximo" aria-label="Próximo"></button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="caixa">
      <p id="modalTexto"></p>
      <div class="acoes">
        <button id="modalComprar" class="btn-comprar">Comprar</button>
        <button id="modalFechar" class="btn-cancelar">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="../estado.js"></script>
  <script src="../transicao.js"></script>
  <script>
    /* =====================================================
 APRESENTAÇÃO — os dados dos itens são lidos do catálogo em estado.js
 =====================================================
 imagem : arte do item (PNG com fundo transparente)
 painel : imagem pronta da parte de baixo do card (nome, nível,
          classe e descrição).
 cor    : cor da borda do card.
*/
    const POR_PAGINA = 6; // quantos cards aparecem por vez

    const apresentacao = {
      espada_fogo: ["../Imagens/Elementos_gráficos/Espada de fogo banner.png", "#f08a1c"],
      espada_gelo: ["../Imagens/Elementos_gráficos/Espada de gelo banner.png", "#009FFF"],
      espada_selva: ["../Imagens/Elementos_gráficos/Espada da selva banner.png", "#007500"],
      espada_sombria: ["../Imagens/Elementos_gráficos/Espada sombria banner.png", "#3D0000"],
      espada_real: ["../Imagens/Elementos_gráficos/Espada real banner.png", "#0097c5"],
      espada_real_nivel_2: ["../Imagens/Elementos_gráficos/Espada Real nivel 2 banner.png", "#F2B600"],
    };
    const itensLoja = Object.values(Jogo.catalogo)
      .filter((item) => item.categoria === "Espadas")
      .map((item) => ({ ...item, imagem: Jogo.getIcone(item.id), painel: apresentacao[item.id][0], cor: apresentacao[item.id][1] }));

    /* ===================== LÓGICA ===================== */
    const lista = document.getElementById("lista");
    const btnAnt = document.getElementById("anterior");
    const btnProx = document.getElementById("proximo");
    let inicio = 0;

    const fmt = (n) => n.toLocaleString("pt-BR");

    function criarCard(a) {
      const el = document.createElement("article");
      el.className = "card";
      el.style.setProperty("--cor", a.cor);
      el.innerHTML = `
        <div class="arte"><img src="${a.imagem}" alt="${a.nome}"></div>
        <img class="painel" src="${a.painel}" alt="${a.nome} - detalhes">
        <span class="card-estado">${a.nome} · ${fmt(a.preco)} moedas · Você tem: ${fmt(Jogo.getQuantidade(a.id))}</span>`;
      el.addEventListener("click", () => comprar(a));
      return el;
    }

    function render() {
      lista.innerHTML = "";
      itensLoja
        .slice(inicio, inicio + POR_PAGINA)
        .forEach((a) => lista.appendChild(criarCard(a)));
      btnAnt.disabled = inicio === 0;
      btnProx.disabled = inicio + POR_PAGINA >= itensLoja.length;
    }

    btnAnt.onclick = () => {
      inicio = Math.max(0, inicio - 1);
      render();
    };
    btnProx.onclick = () => {
      inicio = Math.min(itensLoja.length - POR_PAGINA, inicio + 1);
      render();
    };

    /* Ações de compra delegadas ao estado global. */
    let armaduraSelecionada = null;

    function atualizarSaldo() {
      document.getElementById("saldoValor").textContent = fmt(Jogo.getMoedas());
    }
    function iniciarIconeMoeda() {
      const img = document.getElementById("saldoIcone");
      const moeda = document.createElement("span");
      moeda.className = "moeda";
      img.replaceWith(moeda);
    }

    function comprar(a) {
      armaduraSelecionada = a;
      document.getElementById("modalTexto").textContent =
        `Comprar ${a.nome} por ${fmt(a.preco)} moedas?`;
      document.getElementById("modalComprar").style.display = "";
      document.getElementById("modal").classList.add("aberto");
    }

    function fecharModal() {
      document.getElementById("modal").classList.remove("aberto");
      armaduraSelecionada = null;
    }

    /* Compra via catálogo único e estado compartilhado. */
    function confirmarCompra(a) {
      const resultado = Jogo.comprar(a.id, 1);
      if (!resultado.ok) {
        document.getElementById("modalTexto").textContent = resultado.motivo;
        document.getElementById("modalComprar").style.display = "none";
        return false;
      }
      return true;
    }

    document.getElementById("modalComprar").onclick = () => {
      if (!armaduraSelecionada) return;
      try {
        if (confirmarCompra(armaduraSelecionada)) {
          document.getElementById("modalTexto").textContent = "Comprado!";
          document.getElementById("modalComprar").style.display = "none";
          setTimeout(fecharModal, 900);
        }
      } catch (erro) {
        console.error("Não foi possível registrar a compra da espada.", erro);
        document.getElementById("modalTexto").textContent =
          "Não foi possível registrar a compra. Tente novamente.";
        document.getElementById("modalComprar").style.display = "none";
      }
    };
    document.getElementById("modalFechar").onclick = fecharModal;
    document.getElementById("voltar").onclick = () =>
      window.transicaoVoltar();

    atualizarSaldo();
    iniciarIconeMoeda();
    render();
    window.addEventListener("estado-mudou", () => { atualizarSaldo(); render(); });
  </script>

  <!-- Música da jornada em continuidade (subpasta -> raiz) -->
  <audio
    id="musicaJornada"
    src="../Audios/Arrival to Earth (Film Version) - Transformers (The Expanded Score).mp3"
    loop
    preload="auto"
  ></audio>
  <script src="../continuidade-musica.js"></script>

</body>

</html>
