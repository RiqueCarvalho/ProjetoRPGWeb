<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Last Kingdom</title>
    <link rel="stylesheet" href="TelaInicial.css" />
    <script src="TelaInicial.js" defer></script>
  </head>
  <body>
    <main class="tela-inicial">
      <section class="menu">
        <img src="./Imagens/logo.png" alt="The Last Kingdom" class="logo" />
        <nav class="botoes-menu">
          <!-- Voltamos para <button> para manter o design perfeito do seu CSS -->
          <button
            id="novoJogo"
            class="botao"
            onclick="window.location.href = 'novo_jogo.html'"
          >
            <span>⚔️</span>
            <span>Novo Jogo</span>
          </button>
          <button
            id="creditos"
            class="botao"
            onclick="window.location.href = 'creditos.html'"
          >
            <span>🪙</span>
            <span>Créditos</span>
          </button>
          <button
            id="configuracoes"
            class="botao"
            onclick="window.location.href = 'TelaConfigurações.html'"
          >
            <span>⚙️</span>
            <span>Configurações</span>
          </button>
        </nav>
      </section>
      <img
        src="./Imagens/cavaleiro.png"
        alt="Cavaleiro medieval"
        class="cavaleiro"
      />
    </main>
  </body>
</html>
