<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preload" href="../Imagens/Cen%C3%A1rios/Fundp.png" as="image" />
  <title>Poções</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Pocoes.css" />
  <link rel="stylesheet" href="../EstiloLojaCategorias.css" />
  <link rel="stylesheet" href="../transicao.css" />
</head>

<body class="tela-categoria tela-categoria--pocoes">
  <div class="tela">
    <button class="moldura voltar" id="voltar" type="button" aria-label="Voltar">
      <span class="seta-voltar" aria-hidden="true">←</span>
      <span>Voltar</span>
    </button>

    <h1 class="titulo-categoria">Poções</h1>

    <div class="moldura saldo" title="Seu saldo">
      <img id="saldoIcone" alt="Moedas" />
      <span class="saldo-texto">
        <strong id="saldoValor"></strong>
        <span>Moedas</span>
      </span>
    </div>

    <div class="palco">
      <!-- Lista à esquerda -->
      <div class="coluna">
        <button class="seta sobe oculta" id="sobe" aria-label="Subir"></button>
        <div class="lista" id="lista"></div>
        <button class="seta desce" id="desce" aria-label="Descer"></button>
      </div>

      <!-- Detalhes à direita -->
      <div class="painel" id="painel">
        <div class="foto"><img id="pFoto" alt="" /></div>
        <h2 class="titulo" id="pNome"></h2>
        <div class="preco">
          <img id="pMoeda" alt="" /><span id="pPreco"></span>
        </div>
        <hr />
        <div class="efeito">
          <span id="pEfeitoIcone"></span>
          <p id="pEfeito"></p>
        </div>
        <hr />
        <p class="desc" id="pDesc"></p>
        <!-- Seletor de quantidade e saldo no painel -->
        <div class="quantidade" aria-label="Quantidade">
          <button type="button" id="diminuir" aria-label="Diminuir quantidade">−</button>
          <span id="quantidade">1</span>
          <button type="button" id="aumentar" aria-label="Aumentar quantidade">+</button>
        </div>
        <p class="saldo-painel" id="saldoPainel">Você tem: moedas</p>
        <p class="total" id="total"></p>
        <p class="aviso-moedas" id="avisoMoedas" aria-live="polite"></p>
        <button class="comprar" id="comprar" type="button">Comprar</button>
      </div>
    </div>
  </div>

  <div class="aviso" id="aviso"></div>

  <script src="../estado.js"></script>
  <script src="../transicao.js"></script>
  <script>
    /* A lista e os dados de catálogo vêm agora do estado central. */
    const banners = {
      pocao_cura: "../Imagens/Elementos_gráficos/Poção de cura banner.png",
      pocao_forca: "../Imagens/Elementos_gráficos/Poção de força banner.png",
      pocao_agilidade: "../Imagens/Elementos_gráficos/Poção de agilidade banner.png",
      pocao_defesa: "../Imagens/Elementos_gráficos/Poção de defesa banner.png",
      cerveja: "../Imagens/Elementos_gráficos/Cerveja banner.png",
    };
    const pocoes = Object.values(Jogo.catalogo)
      .filter((item) => item.categoria === "Poções")
      .map((item) => ({
        ...item,
        imagem: Jogo.getIcone(item.id),
        imagemGrande: banners[item.id],
        tipoEfeito: item.efeito,
        efeito: item.efeitoTexto,
        desc: item.descricao,
      }));

    /* ===================== SALDO ===================== */
    /* O saldo é sempre consultado na fonte central Jogo. */
    const fmt = (n) => Number(n).toLocaleString("pt-BR");
    const lerSaldo = () => Jogo.getMoedas();
    function atualizarSaldo() {
      document.getElementById("saldoValor").textContent = fmt(lerSaldo());
    }

    function usarMoedaCss(img) {
      const moeda = criarMoeda();
      moeda.id = img.id;
      img.replaceWith(moeda);
    }
    const criarMoeda = () => {
      const s = document.createElement("span");
      s.className = "moeda";
      return s;
    };

    /* ===================== LISTA E PAINEL ===================== */
    const lista = document.getElementById("lista");
    const btnSobe = document.getElementById("sobe");
    const btnDesce = document.getElementById("desce");
    let atual = 0;
    let quantidade = 1;

    function montarLista() {
      lista.innerHTML = "";
      pocoes.forEach((p, i) => {
        const el = document.createElement("div");
        el.className = "item";
        el.dataset.id = p.id;
        el.innerHTML = `
          <img src="${p.imagem}" alt="">
          <span class="item-nome">
            <span>${p.nome}</span>
            <small class="quantidade-item">Você tem: ${fmt(Jogo.getQuantidade(p.id))}</small>
          </span>
          <span class="item-preco"><span class="moeda"></span><strong>${fmt(p.preco)}</strong></span>`;
        el.querySelector("img").onerror = (e) =>
          (e.target.style.visibility = "hidden");
        el.onclick = () => selecionar(i);
        lista.appendChild(el);
      });
    }

    function selecionar(i) {
      atual = i;
      quantidade = 1;
      document.getElementById("quantidade").textContent = quantidade;
      const p = pocoes[i];
      [...lista.children].forEach((el, j) =>
        el.classList.toggle("ativo", j === i),
      );

      const foto = document.getElementById("pFoto");
      foto.onerror = () => {
        foto.onerror = null;
        if (p.imagem && foto.src !== new URL(p.imagem, location.href).href)
          foto.src = p.imagem;
      };
      foto.src = p.imagemGrande || p.imagem;
      foto.alt = p.nome;

      document.getElementById("pNome").textContent = p.nome;
      document.getElementById("pPreco").textContent =
        `${fmt(p.preco)} Moedas`;
      document.getElementById("pEfeito").textContent = p.efeito;
      document.getElementById("pDesc").textContent = p.desc;

      const box = document.getElementById("pEfeitoIcone");
      box.innerHTML = `<span class="icone-efeito">${iconePorTipo(p.tipoEfeito)}</span>`;
      atualizarTotal();
    }

    /* Setas da lista */
    const PASSO = 88 * 2; // altura de 2 itens (78px + 10px de espaço)
    function atualizarSetas() {
      btnSobe.classList.toggle("oculta", lista.scrollTop <= 2);
      btnDesce.classList.toggle(
        "oculta",
        lista.scrollTop + lista.clientHeight >= lista.scrollHeight - 2,
      );
    }
    btnSobe.onclick = () => lista.scrollBy({ top: -PASSO });
    btnDesce.onclick = () => lista.scrollBy({ top: PASSO });
    lista.addEventListener("scroll", atualizarSetas);
    window.addEventListener("resize", atualizarSetas);

    /* ===================== QUANTIDADE E TOTAL ===================== */
    function iconePorTipo(tipo) {
      return {
        cura: "♥",
        dano: "⚔",
        agilidade: "⚡",
        defesa: "🛡",
        cerveja: "🍺",
      }[tipo] || "★";
    }

    function atualizarTotal() {
      const p = pocoes[atual];
      const saldo = lerSaldo();
      const total = p.preco * quantidade;
      const totalEl = document.getElementById("total");
      const aviso = document.getElementById("avisoMoedas");
      const comprar = document.getElementById("comprar");

      totalEl.textContent = `Total: ${fmt(total)} moedas`;
      document.getElementById("saldoPainel").textContent =
        `Você tem: ${fmt(saldo)} moedas`;
      const insuficiente = total > saldo;
      totalEl.classList.toggle("insuficiente", insuficiente);
      aviso.textContent = insuficiente ? "Moedas insuficientes" : "";
      comprar.disabled = insuficiente;
    }

    document.getElementById("diminuir").onclick = () => {
      quantidade = Math.max(1, quantidade - 1);
      document.getElementById("quantidade").textContent = quantidade;
      atualizarTotal();
    };
    document.getElementById("aumentar").onclick = () => {
      quantidade = Math.min(99, quantidade + 1);
      document.getElementById("quantidade").textContent = quantidade;
      atualizarTotal();
    };

    /* ===================== COMPRA ===================== */
    let timerAviso;
    function avisar(texto, tipo) {
      const a = document.getElementById("aviso");
      a.textContent = texto;
      a.className = `aviso mostra ${tipo}`;
      clearTimeout(timerAviso);
      timerAviso = setTimeout(() => a.classList.remove("mostra"), 2200);
    }

    /* Feedback de compra após a gravação no estado central. */
    function aoComprar(p) {
      console.log("Comprou:", p.nome, "por", p.preco);
    }

    document.getElementById("comprar").onclick = () => {
      const p = pocoes[atual];
      if (p.preco * quantidade > lerSaldo()) {
        atualizarTotal();
        return;
      }
      try {
        const resultado = Jogo.comprar(p.id, quantidade);
        if (!resultado.ok) {
          avisar(resultado.motivo, "erro");
          return;
        }
      } catch (erro) {
        console.error("Não foi possível registrar a compra da poção.", erro);
        avisar("Não foi possível registrar a compra. Tente novamente.", "erro");
        atualizarTotal();
        return;
      }
      aoComprar(p);
      const botao = document.getElementById("comprar");
      botao.classList.add("comprado");
      setTimeout(() => botao.classList.remove("comprado"), 700);
      avisar(`Comprado! ${quantidade}x ${p.nome}`, "ok");
      quantidade = 1;
      document.getElementById("quantidade").textContent = quantidade;
      atualizarTotal();
    };

    document.getElementById("voltar").onclick = () =>
      window.transicaoVoltar();

    /* ===================== INÍCIO ===================== */
    montarLista();
    selecionar(0);
    usarMoedaCss(document.getElementById("saldoIcone"));
    usarMoedaCss(document.getElementById("pMoeda"));
    atualizarSetas();
    function renderizarEstado() {
      atualizarSaldo();
      atualizarListaQuantidades();
      atualizarTotal();
    }
    function atualizarListaQuantidades() {
      [...lista.children].forEach((el) => {
        const id = el.dataset.id;
        const quantidadeEl = el.querySelector(".quantidade-item");
        if (quantidadeEl) quantidadeEl.textContent = `Você tem: ${fmt(Jogo.getQuantidade(id))}`;
      });
    }
    renderizarEstado();
    window.addEventListener("estado-mudou", renderizarEstado);
  </script>

  <!-- Música da jornada em continuidade (subpasta -> raiz) -->
  <audio
    id="musicaJornada"
    src="../Audios/Arrival to Earth (Film Version) - Transformers (The Expanded Score).mp3"
    loop
    preload="auto"
  ></audio>
  <script src="../continuidade-musica.js"></script>

</body>

</html>
