
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Kingdom</title>
    <link rel="stylesheet" href="Carregamento.css">
</head>
<body>
    <main class="tela-carregamento">
        <div class="sombra"></div>

        <section class="painel-carregamento">
            <div class="titulo-jogo">
                <span class="ornamento">✦ ━━━━━━━━━ ✦</span>
                <h1>THE LAST<br><span>KINGDOM</span></h1>
                <span class="ornamento inferior">━━━━━━━━━ ⚔ ━━━━━━━━━</span>
            </div>

            <p class="subtitulo" id="mensagem">
                Prepare-se para a jornada...
            </p>

            <div class="area-barra" id="areaBarra">
                <img
                    src="mago.png"
                    alt="Professor mago"
                    class="mago"
                    id="mago"
                >

                <div class="barra">
                    <div class="progresso" id="progresso"></div>
                </div>
            </div>

            <p class="texto-carregamento" id="texto">
                Os portões do reino estão se abrindo...
            </p>
        </section>
    </main>

    <script src="Carregamento.js"></script>
</body>
</html>
