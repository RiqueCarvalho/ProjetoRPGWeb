<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Last Kingdom</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="TelaInicial2.css" />
    <script src="TelaInicial3.js" defer></script>
  </head>

  <body>
    <button
      class="btn-voltar"
      onclick="window.location.href = 'TelaInicial2.html'"
    >
      <img
        src="./Imagens/Elementos_gráficos/WhatsApp Image 2026-10-28 at 11.26.43.jpeg"
        alt="Voltar"
      />
    </button>

    <main class="tela-inicial">
      <section class="menu">
        <img
          src="./Imagens/Elementos_gráficos/logo.png"
          alt="The Last Kingdom"
          class="logo"
        />
        <nav class="botoes-menu">
          <button
            id="novoJogo"
            class="botao"
            onclick="
              window.location.href = 'TelaEscolherPersonagemMasculino.html'
            "
          >
            <span>⚔️</span>
            <span>Personagem Masculino</span>
          </button>
          <button
            id="creditos"
            class="botao"
            onclick="
              window.location.href = 'TelaEscolherPersonagemFeminino.html'
            "
          >
            <span>⚔️</span>
            <span>Personagem Feminino</span>
          </button>
        </nav>
      </section>
      <img
        src="./Imagens/Elementos_gráficos/cavaleiro.png"
        alt="Cavaleiro medieval"
        class="cavaleiro"
      />
    </main>

    <!-- Música da jornada em continuidade -->
    <audio
      id="musicaJornada"
      src="./Audios/Arrival to Earth (Film Version) - Transformers (The Expanded Score).mp3"
      loop
      preload="auto"
    ></audio>
    <script src="continuidade-musica.js"></script>
  </body>
</html>
