        position: absolute;
        inset: 0;
        pointer-events: none;
        background: var(--arte) center / 100% 100% no-repeat;
        transition: filter 0.5s;
        animation: respiro var(--v, 5s) ease-in-out var(--a, 0s) infinite;
      }

          transparent 100%

        );

      .p2 {
        --v: 4.6s;
        --a: -1.5s;
        transform-origin: 50% 73%;
        -webkit-mask-image: radial-gradient(
          ellipse 15% 29% at 50.3% 48%,
          #000 62%,
          transparent 100%
        );
        mask-image: radial-gradient(
          ellipse 15% 29% at 50.3% 48%,
          #000 62%,
          transparent 100%
        );
      }
      .p3 {
        --v: 5.8s;
        --a: -3s;
        transform-origin: 82% 85%;
        -webkit-mask-image: radial-gradient(
          ellipse 17% 36% at 81.8% 50%,
          #000 62%,
          transparent 100%
        );
        mask-image: radial-gradient(
          ellipse 17% 36% at 81.8% 50%,
          #000 62%,
          transparent 100%
        );
      }
      @keyframes respiro {
        0%,
        100% {
          transform: rotate(-0.4deg) translateY(0) scale(1);
        }
        50% {
          transform: rotate(0.4deg) translateY(-0.4%) scale(1.014, 1.024);
        }
      }
      .palco[data-foco="1"] .p1,
      .palco[data-foco="2"] .p2,
      .palco[data-foco="3"] .p3 {
        filter: brightness(1.12);
        animation-duration: 2.4s;
      }
      .palco[data-sel="1"] .p1,
      .palco[data-sel="2"] .p2,
      .palco[data-sel="3"] .p3 {
        filter: brightness(1.22) contrast(1.05);
      }
      @keyframes respirar {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.018);
        }
      }

      /* Chamas balançando (esquerda/topo = base da chama) */
      .f {
        position: absolute;
        width: var(--w);
        aspect-ratio: 1 / 1.4;
        transform: translate(-50%, -100%);
        filter: drop-shadow(0 0 8px var(--h, #ff7a1a));
        pointer-events: none;
      }
      .f::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%;
        mix-blend-mode: screen;
        transform-origin: 50% 100%;
        background: radial-gradient(
          ellipse at 50% 85%,
          var(--n1, #fff3b0) 0,
          var(--n2, #ffb13b) 30%,
          var(--n3, #ff5a14) 58%,
          transparent 75%
        );
        animation:
          balancar 1.3s ease-in-out var(--d, 0s) infinite alternate,
          brilho 0.7s ease-in-out var(--d, 0s) infinite alternate;
      }
      @keyframes balancar {
        from {
          transform: rotate(-7deg) skewX(-6deg) scale(0.95, 0.9);
        }
        to {
          transform: rotate(7deg) skewX(6deg) scale(1.05, 1.15);
        }
      }
      @keyframes brilho {
        from {
          opacity: 0.72;
        }
        to {
          opacity: 1;
        }
      }
      .verde {
        --n1: #eaffff;
        --n2: #4ff3d0;
        --n3: #07a58a;
        --h: #2fe8c4;
      }

      /* Luzes que pulsam */
      .g {
        position: absolute;
        transform: translate(-50%, -50%);
        width: var(--w);
        aspect-ratio: var(--r, 1);
        border-radius: 50%;
        pointer-events: none;
        mix-blend-mode: screen;
        background: radial-gradient(closest-side, var(--gc), transparent);
        animation: pulso var(--p, 4s) ease-in-out infinite alternate;
      }
      @keyframes pulso {
        from {
          opacity: 0.3;
          scale: 0.9;
        }
        to {
          opacity: 0.95;
          scale: 1.12;
        }
      }
      .luz {
        animation: none;
        opacity: 0;
        transition: opacity 0.5s;
        --r: 1 / 1.5;
      }
      .palco[data-foco="1"] .l1,
      .palco[data-sel="1"] .l1,
      .palco[data-foco="2"] .l2,
      .palco[data-sel="2"] .l2,
      .palco[data-foco="3"] .l3,
      .palco[data-sel="3"] .l3 {
        opacity: 1;
      }

      /* Brasas e névoa */
      .brasa {
        position: absolute;
        bottom: -2%;
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        background: var(--c);
        box-shadow: 0 0 6px 1px var(--c);
        opacity: 0;
        pointer-events: none;
        animation: subir var(--t) linear var(--a) infinite;
      }
      @keyframes subir {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        10% {
          opacity: 0.95;
        }
        100% {
          transform: translate(var(--x), calc(var(--alt, 460px) * -1.05));
          opacity: 0;
        }
      }
      .nevoa {
        position: absolute;
        left: -30%;
        bottom: 0;
        width: 160%;
        height: 32%;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.8;
        background:
          radial-gradient(
            ellipse at 30% 60%,
            rgba(190, 215, 255, 0.2),
            transparent 60%
          ),
          radial-gradient(
            ellipse at 75% 70%,
            rgba(255, 255, 255, 0.12),
            transparent 55%
          );
        animation: derivar 24s ease-in-out infinite alternate;
      }
      .nevoa.n2 {
        bottom: 4%;
        animation-duration: 33s;
        animation-direction: alternate-reverse;
        opacity: 0.55;
      }
      @keyframes derivar {
        to {
          transform: translateX(20%);
        }
      }

      /* Botões Selecionar: ficam por cima dos botões da imagem */
      .selecionar {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 20.4%;
        height: 8%;
        border: 2px solid transparent;
        border-radius: 999px;
        cursor: pointer;
        overflow: hidden;
        background: transparent;
        animation: anel 2.2s ease-in-out infinite;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .selecionar::after {
        content: "";
        position: absolute;
        top: 0;
        left: -60%;
        width: 40%;
        height: 100%;
        transform: skewX(-20deg);
        background: linear-gradient(
          100deg,
          transparent,
          #ffffff99,
          transparent
        );
        animation: reluzir 3.2s ease-in-out infinite;
      }
      .selecionar:hover {
        transform: translate(-50%, -50%) scale(1.07);
        background: rgba(255, 215, 150, 0.2);
      }
      .selecionar:active {
        transform: translate(-50%, -50%) scale(0.94);
      }
      .selecionar:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      .selecionar.ativo {
        background: rgba(255, 220, 150, 0.28);
        border-color: var(--cb);
        box-shadow: 0 0 22px 6px var(--cb);
        animation: none;
      }
      @keyframes anel {
        0%,
        100% {
          box-shadow:
            0 0 0 0 transparent,
            0 0 5px var(--cb);
        }
        50% {
          box-shadow:
            0 0 16px 4px var(--cb),
            0 0 4px var(--cb);
        }
      }
      @keyframes reluzir {
        0%,
        55% {
          left: -60%;
        }
        100% {
          left: 130%;
        }
      }
      .onda {
        position: absolute;
        border-radius: 50%;
        background: #ffffff88;
        transform: scale(0);
        pointer-events: none;
        animation: expandir 0.6s ease-out forwards;
      }
      @keyframes expandir {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

      .voltar {
        position: absolute;
        left: 5.13%;
        top: 4.44%;
        transform: translate(-50%, -50%);
        width: 5.8%;
        height: 8.4%;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
        background: transparent;
        --cb: #ffa53a;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .voltar:hover {
        transform: translate(-50%, -50%) scale(1.08);
        background: rgba(255, 190, 100, 0.2);
        animation: anel 1.3s ease-in-out infinite;
      }
      .voltar:active {
        transform: translate(-50%, -50%) scale(0.94);
      }
      .voltar:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }

      .selecionar {
        width: 20.5%;
        height: 8.2%;
        border-radius: 16px;
      }
      .selecionar::before {
        content: "✔ Selecionado";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        transition: opacity 0.25s;
        font:
          bold 2.1cqw Georgia,
          serif;
        color: #3a1a05;
        background: linear-gradient(#ffe9ae, #eaa33a);
      }
      .selecionar.ativo::before {
        opacity: 1;
      }
      .selecionar:hover {
        box-shadow:
          0 0 16px 4px var(--cb),
          inset 0 0 12px var(--cb);
      }
      .selecionar.ativo {
        background: transparent;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="palco">
      <div class="cena">
        <i class="pers p1"></i><i class="pers p2"></i><i class="pers p3"></i>
        <!-- Luzes de cada personagem (aparecem ao passar o mouse e ao selecionar) -->
        <i
          class="g luz l1"
          style="left: 17%; top: 56%; --w: 34%; --gc: rgba(60, 255, 210, 0.5)"
        ></i>
        <i
          class="g luz l2"
          style="left: 50%; top: 56%; --w: 34%; --gc: rgba(255, 150, 50, 0.5)"
        ></i>
        <i
          class="g luz l3"
          style="left: 84%; top: 56%; --w: 34%; --gc: rgba(255, 60, 40, 0.55)"
        ></i>

        <!-- Luzes do cenário -->
        <i
          class="g"
          style="
            left: 7%;
            top: 37%;
            --w: 22%;
            --gc: rgba(40, 255, 200, 0.55);
            --p: 3.6s;
          "
        ></i>
        <i
          class="g"
          style="
            left: 18.2%;
            top: 42.5%;
            --w: 7%;
            --gc: rgba(80, 255, 180, 0.7);
            --p: 2.2s;
          "
        ></i>
        <i
          class="g"
          style="
            left: 50%;
            top: 76%;
            --w: 30%;
            --gc: rgba(255, 140, 40, 0.4);
            --p: 4.8s;
          "
        ></i>
        <i
          class="g"
          style="
            left: 82%;
            top: 91%;
            --w: 42%;
            --r: 1/0.55;
            --gc: rgba(255, 60, 20, 0.55);
            --p: 3s;
          "
        ></i>

        <!-- Tochas e velas -->
        <i class="f" style="left: 38%; top: 4.8%; --w: 5.6%"></i>
        <i class="f" style="left: 62.2%; top: 4.4%; --w: 5.6%; --d: -0.6s"></i>
        <i class="f" style="left: 37.9%; top: 38.5%; --w: 2.6%; --d: -0.3s"></i>
        <i class="f" style="left: 62.2%; top: 38%; --w: 2.6%; --d: -0.9s"></i>
        <i
          class="f verde"
          style="left: 1.2%; top: 46%; --w: 2.8%; --d: -0.5s"
        ></i>
        <i class="f" style="left: 98.3%; top: 54%; --w: 3%; --d: -0.2s"></i>

        <div class="nevoa"></div>
        <div class="nevoa n2"></div>

        <button class="voltar" type="button" aria-label="Voltar"></button>
        <button
          class="selecionar"
          type="button"
          data-id="1"
          data-nome="Cavaleiro da Morte"
          style="left: 16.96%; top: 95.24%; --cb: #3ff2d0"
        ></button>
        <button
          class="selecionar"
          type="button"
          data-id="2"
          data-nome="Bárbaro"
          style="left: 49.38%; top: 95.24%; --cb: #ffa53a"
        ></button>
        <button
          class="selecionar"
          type="button"
          data-id="3"
          data-nome="Demônio"
          style="left: 84.13%; top: 95.24%; --cb: #ff4b2e"
        ></button>
      </div>
    </main>
    <p id="aviso" aria-live="polite"></p>
    <script>
      const palco = document.querySelector(".palco");
      const cena = document.querySelector(".cena");
      const aviso = document.getElementById("aviso");
      const botoes = document.querySelectorAll(".selecionar");

      // Guarda a altura do palco para as brasas subirem até o topo
      function ajustar() {
        palco.style.setProperty("--alt", palco.clientHeight + "px");
      }
      addEventListener("resize", ajustar);
      ajustar();

      // Brasas: verdes à esquerda, laranjas no meio e vermelhas à direita
      const cores = ["#5ff3d6", "#ffa43a", "#ff4b2e"];
      for (let i = 0; i < 32; i++) {
        const b = document.createElement("i");
        b.className = "brasa";
        const x = Math.random() * 100;
        b.style.left = x + "%";
        b.style.setProperty("--c", cores[x < 33 ? 0 : x < 66 ? 1 : 2]);
        b.style.setProperty("--s", 2 + Math.random() * 3 + "px");
        b.style.setProperty("--t", 6 + Math.random() * 8 + "s");
        b.style.setProperty("--a", -Math.random() * 12 + "s");
        b.style.setProperty("--x", Math.random() * 60 - 30 + "px");
        cena.appendChild(b);
      }

      botoes.forEach((botao) => {
        const id = botao.dataset.id;
        const destacar = () => (palco.dataset.foco = id);
        const apagar = () => delete palco.dataset.foco;
        botao.addEventListener("mouseenter", destacar);
        botao.addEventListener("focus", destacar);
        botao.addEventListener("mouseleave", apagar);
        botao.addEventListener("blur", apagar);

        botao.addEventListener("click", (e) => {
          // Onda saindo do ponto do clique
          const a = botao.getBoundingClientRect();
          const t = Math.max(a.width, a.height);
          const onda = document.createElement("span");
          onda.className = "onda";
          onda.style.cssText = `width:${t}px;height:${t}px;left:${e.clientX - a.left - t / 2}px;top:${e.clientY - a.top - t / 2}px`;
          botao.appendChild(onda);
          onda.addEventListener("animationend", () => onda.remove());

          botoes.forEach((o) => o.classList.remove("ativo"));
          botao.classList.add("ativo");
          palco.dataset.sel = id;
          aviso.textContent = "Você escolheu: " + botao.dataset.nome;
          // Aqui você pode guardar a escolha ou ir para a próxima tela
        });
      });

      document
        .querySelector(".voltar")
        .addEventListener("click", () => history.back());
    </script>
  </body>
</html>
